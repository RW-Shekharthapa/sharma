<main class="todo-app">
  <h1>Todo</h1>

  <form class="add-form" (ngSubmit)="add()">
    <input
      type="text"
      placeholder="What needs to be done?"
      [ngModel]="newTitle()"
      (ngModelChange)="newTitle.set($event)"
      name="newTitle"
    />
    <button type="submit">Add</button>
  </form>

  <ul class="todo-list">
    @for (todo of todos(); track todo.id) {
      <li [class.completed]="todo.completed">
        <input type="checkbox" [checked]="todo.completed" (change)="toggle(todo)" />
        <span>{{ todo.title }}</span>
        <button type="button" class="delete" (click)="remove(todo)">✕</button>
      </li>
    } @empty {
      <li class="empty">No todos yet</li>
    }
  </ul>
</main>
